<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#ffffff;--bg2:#f5f5f4;--bg3:#fafaf9;
    --text:#1c1917;--text2:#78716c;--text3:#a8a29e;
    --border:#e7e5e4;--border2:#d6d3d1;
    --red:#E24B4A;--red-bg:#FCEBEB;--red-dark:#A32D2D;
    --amber:#BA7517;--amber-bg:#FAEEDA;--amber-dark:#854F0B;
    --green:#639922;--green-bg:#EAF3DE;--green-dark:#3B6D11;
    --blue:#185FA5;--blue-bg:#E6F1FB;--blue-dark:#0f3d6e;
    --radius:10px;--radius-sm:6px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
  }
  body{background:var(--bg3);color:var(--text);font-size:14px;line-height:1.5}
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:200px;flex-shrink:0;background:var(--bg);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .logo{padding:16px 14px 14px;border-bottom:1px solid var(--border)}
  .logo-main{font-size:15px;font-weight:600;color:var(--text)}
  .logo-sub{font-size:11px;color:var(--text2);margin-top:2px}
  .nav-lbl{font-size:10px;color:var(--text3);padding:14px 14px 4px;letter-spacing:.6px;text-transform:uppercase;font-weight:600}
  .nbtn{
    display:flex;align-items:center;gap:9px;width:100%;
    padding:8px 14px;border:none;background:none;cursor:pointer;
    font-size:13px;color:var(--text2);text-align:left;
    font-family:inherit;transition:all .15s;
  }
  .nbtn:hover{background:var(--bg2);color:var(--text)}
  .nbtn.on{background:var(--bg2);color:var(--text);font-weight:600}
  .nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 7px;font-weight:600}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{
    padding:14px 24px;border-bottom:1px solid var(--border);
    background:var(--bg);display:flex;align-items:center;
    justify-content:space-between;position:sticky;top:0;z-index:10;
  }
  .tbtitle{font-size:16px;font-weight:600}
  .tbsub{font-size:12px;color:var(--text2);margin-top:2px}
  .xppill{font-size:12px;font-weight:600;color:var(--amber-dark);background:var(--amber-bg);padding:5px 12px;border-radius:20px;border:1px solid #FAC775}
  .content{flex:1;padding:20px 24px}
  .btn{
    border:1px solid var(--border2);background:var(--bg);
    border-radius:var(--radius-sm);padding:7px 14px;
    font-size:13px;cursor:pointer;font-family:inherit;
    color:var(--text);transition:all .15s;
  }
  .btn:hover{background:var(--bg2);border-color:var(--text3)}
  .btnp{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  .btnp:hover{background:#c73938;border-color:#c73938}
  .btng{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .btng:hover{background:#4e7a1a}
  .card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .pbar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
  .pfill{height:100%;border-radius:3px;transition:width .5s}
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);
    z-index:999;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(2px);
  }
  .modal{
    background:var(--bg);border-radius:var(--radius);
    padding:22px;max-width:380px;width:90%;
    border:1px solid var(--border);
    max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.15);
  }
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>

function shuf(a){return [...a].sort(()=>Math.random()-.5)}

function PBar({val,color,height}){
  return h('div',{className:'pbar',style:{height:height||6}},
    h('div',{className:'pfill',style:{width:val+'%',background:color||'var(--red)'}})
  )
}

function StatBox({n,label,bg,color}){
  return h('div',{style:{background:bg,border:'1px solid '+color+'33',borderRadius:'var(--radius)',padding:'12px 16px',textAlign:'center'}},
    h('div',{style:{fontSize:22,fontWeight:700,color:color,lineHeight:1}},n),
    h('div',{style:{fontSize:11,color:color,marginTop:3,opacity:.75}},label)
  )
}

// ===================== FLASHCARD =====================
function FlashcardPage(){
  const [cards]=useState(()=>shuf(FLASHCARDS));
  const [idx,setIdx]=useState(0);
  const [flipped,setFlipped]=useState(false);
  const [stats,setStats]=useState({forgot:0,hard:0,good:0});
  const [done,setDone]=useState(false);
  const card=cards[idx];
  const rate=r=>{
    setStats(s=>({...s,[r]:s[r]+1}));
    if(idx+1>=cards.length){setDone(true);}
    else{setIdx(i=>i+1);setFlipped(false);}
  };
  const restart=()=>{setIdx(0);setFlipped(false);setStats({forgot:0,hard:0,good:0});setDone(false);};
  if(done)return h('div',{style:{maxWidth:460,margin:'40px auto',textAlign:'center'}},
    h('div',{style:{fontSize:52,marginBottom:12}},'🎉'),
    h('div',{style:{fontSize:22,fontWeight:700,marginBottom:5}},'Xong phiên hôm nay!'),
    h('div',{style:{fontSize:13,color:'var(--text2)',marginBottom:20}},'Đã ôn xong '+cards.length+' thẻ'),
    h('div',{style:{display:'flex',gap:10,justifyContent:'center',marginBottom:20}},
      h(StatBox,{n:stats.forgot,label:'Quên',bg:'var(--red-bg)',color:'var(--red-dark)'}),
      h(StatBox,{n:stats.hard,label:'Khó',bg:'var(--amber-bg)',color:'var(--amber-dark)'}),
      h(StatBox,{n:stats.good,label:'Nhớ',bg:'var(--green-bg)',color:'var(--green-dark)'})
    ),
    h('button',{className:'btn btnp',style:{padding:'10px 28px',fontSize:14},onClick:restart},'Làm lại')
  );
  const pct=Math.round((idx/cards.length)*100);
  return h('div',{style:{maxWidth:480,margin:'0 auto'}},
    h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:14}},
      h('span',{style:{fontSize:12,color:'var(--text2)',flexShrink:0}},(idx+1)+' / '+cards.length),
      h('div',{className:'pbar',style:{flex:1}},
        h('div',{className:'pfill',style:{width:pct+'%',background:'var(--amber)'}})
      ),
      h('span',{style:{fontSize:12,color:'var(--text2)',flexShrink:0}},pct+'%')
    ),
    h('div',{
      onClick:()=>{if(!flipped)setFlipped(true)},
      style:{
        background:flipped?'var(--text)':'var(--bg)',
        border:'1px solid '+(flipped?'var(--text)':'var(--border)'),
        borderRadius:var(--radius),
        minHeight:220,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
        padding:28,cursor:flipped?'default':'pointer',textAlign:'center',
        transition:'all .25s',boxShadow:flipped?'0 8px 32px rgba(0,0,0,.12)':'0 2px 8px rgba(0,0,0,.06)'
      }
    },
      flipped
        ? h('div',null,
            h('div',{style:{fontSize:10,letterSpacing:1.5,color:'rgba(255,255,255,.4)',marginBottom:12,textTransform:'uppercase'}},'Nghĩa & ví dụ'),
            h('div',{style:{fontSize:22,fontWeight:700,color:'#FAC775',marginBottom:10}},card.meaning),
            h('div',{style:{fontSize:14,color:'rgba(255,255,255,.85)',lineHeight:1.7,marginBottom:4}},card.ex),
            h('div',{style:{fontSize:12,color:'rgba(255,255,255,.45)'}},card.exVi)
          )
        : h('div',null,
            h('div',{style:{fontSize:10,letterSpacing:1.5,color:'var(--text3)',marginBottom:12,textTransform:'uppercase'}},'Từ vựng · N5'),
            h('div',{style:{fontFamily:'serif',fontSize:54,fontWeight:700,lineHeight:1,marginBottom:10}},card.kanji),
            h('div',{style:{fontSize:18,color:'var(--text2)',marginBottom:12}},card.kana),
            h('div',{style:{fontSize:12,color:'var(--text3)'}},'Nhấn để xem nghĩa →')
          )

// ===================== QUIZ =====================
function QuizPage(){
  const [screen,setScreen]=useState('menu');
  const [qtype,setQtype]=useState('all');
  const [qs,setQs]=useState([]);
  const [cur,setCur]=useState(0);
  const [sel,setSel]=useState(null);
  const [correct,setCorrect]=useState(0);
  const TMAP={vocab:'TU VUNG',grammar:'NGU PHAP',fill:'DIEN TU',kanji:'KANJI'};
  const TLABEL={'TU VUNG':'Từ vựng','NGU PHAP':'Ngữ pháp','DIEN TU':'Điền từ','KANJI':'Kanji'};
  const start=()=>{
    let pool=qtype==='all'?QUIZPOOL:QUIZPOOL.filter(q=>q.tp===TMAP[qtype]);
    if(!pool||pool.length===0)pool=QUIZPOOL;
    const picked=shuf(pool).slice(0,Math.min(10,pool.length));
    let final=[...picked];
    while(final.length<10){final=[...final,...shuf(QUIZPOOL).slice(0,10-final.length)];}
    setQs(final.slice(0,10));setCur(0);setSel(null);setCorrect(0);setScreen('quiz');
  };
  const choose=i=>{
    if(sel!==null)return;
    setSel(i);
    if(i===qs[cur].ans)setCorrect(c=>c+1);
  };
  const next=()=>{
    if(cur+1>=qs.length){setScreen('result');return;}
    setCur(c=>c+1);setSel(null);
  };
  const TYPES=[['all','🎲 Tổng hợp'],['vocab','📖 Từ vựng'],['grammar','📝 Ngữ pháp'],['fill','✏️ Điền từ'],['kanji','漢 Kanji']];
  if(screen==='menu')return h('div',{style:{maxWidth:520,margin:'0 auto'}},
    h('div',{style:{fontSize:14,fontWeight:600,marginBottom:12}},'Chọn loại câu hỏi'),
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:20}},
      TYPES.map(([k,l])=>h('button',{key:k,className:'btn',onClick:()=>setQtype(k),
        style:{padding:'14px 10px',fontSize:13,textAlign:'center',background:qtype===k?'var(--text)':'',color:qtype===k?'#fff':'',borderColor:qtype===k?'var(--text)':''}},l))
    ),
    h('div',{style:{textAlign:'center'}},
      h('button',{className:'btn btnp',style:{padding:'12px 36px',fontSize:14},onClick:start},'🚀 Bắt đầu — 10 câu')
    )
  );
  if(screen==='result'){
    const pct=Math.round(correct/qs.length*100);
    return h('div',{style:{maxWidth:420,margin:'30px auto',textAlign:'center'}},
      h('div',{style:{fontSize:52,marginBottom:12}},pct>=80?'🎉':pct>=60?'👍':'💪'),
      h('div',{style:{fontSize:22,fontWeight:700,marginBottom:4}},'Hoàn thành!'),
      h('div',{style:{fontSize:13,color:'var(--text2)',marginBottom:20}},'10 câu trắc nghiệm N5'),
      h('div',{style:{display:'flex',gap:10,justifyContent:'center',marginBottom:24}},
        h(StatBox,{n:correct,label:'Đúng',bg:'var(--green-bg)',color:'var(--green-dark)'}),
        h(StatBox,{n:qs.length-correct,label:'Sai',bg:'var(--red-bg)',color:'var(--red-dark)'}),
        h(StatBox,{n:pct+'%',label:'Điểm',bg:'var(--amber-bg)',color:'var(--amber-dark)'})
      ),
      h('div',{style:{display:'flex',gap:10,justifyContent:'center'}},
        h('button',{className:'btn btnp',style:{padding:'10px 24px'},onClick:start},'Làm lại'),
        h('button',{className:'btn',style:{padding:'10px 24px'},onClick:()=>setScreen('menu')},'Đổi loại')
      )
    )
  }
  const q=qs[cur];
  const OL=['A','B','C','D'];
  return h('div',{style:{maxWidth:520,margin:'0 auto'}},
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}},
      h('span',{style:{fontSize:11,borderRadius:4,padding:'4px 10px',background:'var(--red-bg)',color:'var(--red-dark)',fontWeight:700}},TLABEL[q.tp]||q.tp),
      h('span',{style:{fontSize:12,color:'var(--text2)'}},'Câu '+(cur+1)+' / '+qs.length)
    ),
    h(PBar,{val:Math.round(cur/qs.length*100),color:'var(--red)'}),
    h('div',{style:{height:14}}),
    h('div',{className:'card',style:{marginBottom:12}},
      h('div',{style:{fontFamily:'serif',fontSize:26,fontWeight:700,textAlign:'center',marginBottom:6,lineHeight:1.4}},q.q),
      h('div',{style:{fontSize:13,textAlign:'center',color:'var(--text2)',marginBottom:16}},q.qsub),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
        q.opts.map((o,i)=>{
          let bg='var(--bg)',bc='var(--border)',tc='var(--text)';
          if(sel!==null){
            if(i===q.ans){bg='var(--green-bg)';bc='var(--green)';tc='var(--green-dark)';}
            else if(i===sel&&i!==q.ans){bg='var(--red-bg)';bc='var(--red)';tc='var(--red-dark)';}
          }
          return h('button',{key:i,onClick:()=>choose(i),
            style:{
              display:'flex',alignItems:'center',gap:8,padding:'11px 13px',
              border:'1.5px solid '+bc,borderRadius:var(--radius-sm),
              background:bg,cursor:sel!==null?'default':'pointer',
              fontSize:13,color:tc,textAlign:'left',fontFamily:'inherit',transition:'all .15s'
            },
            onMouseEnter:e=>{if(sel===null)e.currentTarget.style.borderColor='var(--red)'},
            onMouseLeave:e=>{if(sel===null)e.currentTarget.style.borderColor='var(--border)'}},
            h('span',{style:{
              display:'inline-flex',width:22,height:22,borderRadius:'50%',
              background:'var(--bg2)',color:'var(--text3)',fontSize:11,fontWeight:700,
              alignItems:'center',justifyContent:'center',flexShrink:0
            }},OL[i]),
            o
          )
        })
      ),
      sel!==null&&h('div',{style:{
        marginTop:12,padding:'10px 13px',borderRadius:var(--radius-sm),
        background:sel===q.ans?'var(--green-bg)':'var(--red-bg)',
        border:'1px solid '+(sel===q.ans?'var(--green)':'var(--red)'),
        fontSize:12,color:sel===q.ans?'var(--green-dark)':'var(--red-dark)',lineHeight:1.7
      }},
        h('span',{style:{fontWeight:700}},sel===q.ans?'✓ Đúng rồi! ':'✗ Sai. '),q.explain
      )
    ),
    sel!==null&&h('button',{className:'btn',style:{width:'100%',padding:12,fontSize:13,fontWeight:600},onClick:next},
      cur+1<qs.length?'Câu tiếp theo →':'Xem kết quả →'
    )
  )
}

// ===================== PROGRESS =====================

      h('div',{style:{fontSize:10,letterSpacing:1.5,color:'#FAC775',textTransform:'uppercase',fontWeight:600,marginBottom:6}},'🎯 Phân tích AI — trình độ hiện tại'),
      h('div',{style:{fontSize:14,lineHeight:1.8,marginBottom:12}},
        'Bạn đang ở khoảng ',h('strong',{style:{color:'#FAC775'}},'62% N5'),
        '. Điểm mạnh: ',h('strong',{style:{color:'#FAC775'}},'từ vựng cơ bản'),

      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
        ['Ôn trợ từ に / で — làm 5 bài điền trợ từ hôm nay','Học 10 từ vựng chủ đề Gia đình còn lại','Ôn 8 thẻ flashcard đang ở trạng thái Khó'].map((s,i)=>
          h('div',{key:i,style:{display:'flex',gap:8,alignItems:'center',padding:'7px 10px',background:'rgba(255,255,255,.07)',borderRadius:'var(--radius-sm)',fontSize:12}},
            h('span',{style:{color:'#FAC775',fontWeight:700}},'→'),s
          )
        )
      )
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}},
      h('div',{className:'card'},
        h('div',{style:{fontSize:13,fontWeight:600,marginBottom:14}},'📊 Kỹ năng chi tiết'),
        ...[
          ['Từ vựng',78,'var(--red)','127/800 từ'],
          ['Kanji',55,'var(--amber)','43/100'],
          ['Ngữ pháp',62,'var(--green)','18/30 mẫu'],
          ['Trắc nghiệm',84,'var(--blue)','84% đúng'],
          ['Trợ từ ⚠️',52,'var(--red)','52% đúng — yếu'],
        ].map(([l,v,c,sub])=>
          h('div',{key:l,style:{marginBottom:12}},
            h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}},
              h('span',{style:{fontWeight:500}},l),
              h('span',{style:{color:'var(--text2)'}},sub)
            ),
            h(PBar,{val:v,color:c})
          )
        )
      ),
      h('div',null,
        h('div',{className:'card',style:{marginBottom:14}},
          h('div',{style:{fontSize:13,fontWeight:600,marginBottom:12}},'📅 Thống kê'),
          ...[['127 từ','Từ đã học'],['43 kanji','Kanji đã học'],['🔥 7 ngày','Học liên tiếp'],['⚡ 1,240 XP','Tổng điểm']].map(([n,l])=>
            h('div',{key:l,style:{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid var(--border)',fontSize:13}},
              h('span',{style:{color:'var(--text2)'}},l),
              h('span',{style:{fontWeight:600}},n)
            )

        h('div',{className:'card'},
          h('div',{style:{fontSize:13,fontWeight:600,marginBottom:10}},'🏅 Huy hiệu'),

            [['🔥','7 ngày'],['📖','100 từ'],['漢','40 kanji'],['✅','84% đúng']].map(([ic,l])=>
              h('div',{key:l,style:{textAlign:'center'}},

// ===================== APP SHELL =====================
const NAVS=[
  {k:'dashboard',lb:'Tổng quan',ic:'🏠'},
  {k:'vocab',lb:'Từ vựng',ic:'📖'},
  {k:'kanji',lb:'Kanji',ic:'漢'},
  {k:'grammar',lb:'Ngữ pháp',ic:'✏️'},
  {k:'flashcard',lb:'Flashcard',ic:'🃏',badge:8},
  {k:'quiz',lb:'Trắc nghiệm',ic:'✅'},
  {k:'progress',lb:'Tiến độ',ic:'📊'},
];
const SUBS={
  dashboard:'Hôm nay học gì nhé?',
  vocab:'127 / 800 từ N5 đã học',
  kanji:'43 / 100 kanji N5 đã học',
  grammar:'18 / 30 mẫu câu N5',
  flashcard:'8 thẻ cần ôn hôm nay',
  quiz:'Luyện từ vựng, ngữ pháp, kanji N5',
  progress:'Phân tích chi tiết kỹ năng',
};

function App(){
  const [page,setPage]=useState('dashboard');
  const nav=NAVS.find(n=>n.k===page)||NAVS[0];
  return h('div',{className:'app'},
    h('aside',{className:'sidebar'},
      h('div',{className:'logo'},
        h('div',{className:'logo-main'},'日 Nihongo Roadmap'),
        h('div',{className:'logo-sub'},'N5 — 62% hoàn thành · 🔥 7 ngày')
      ),
      h('div',{className:'nav-lbl'},'Menu'),
      NAVS.map(n=>h('button',{key:n.k,className:'nbtn'+(page===n.k?' on':''),onClick:()=>setPage(n.k)},
        h('span',{style:{fontSize:15,width:20,textAlign:'center',flexShrink:0}},n.ic),
        n.lb,
        n.badge&&page!==n.k&&h('span',{className:'nbadge'},n.badge)
      )),
      h('div',{style:{marginTop:'auto',padding:'14px',borderTop:'1px solid var(--border)',fontSize:12,color:'var(--text2)'}},
        h('div',null,'⚡ 1,240 XP tổng cộng'),
        h('div',{style:{marginTop:4,color:'var(--text3)'}},'Mở khoá N4 sau khi đạt 80% N5')
      )
    ),
    h('div',{className:'main'},
      h('div',{className:'topbar'},
        h('div',null,
          h('div',{className:'tbtitle'},nav.lb),
          h('div',{className:'tbsub'},SUBS[page])
        ),
        h('span',{className:'xppill'},'⚡ 1,240 XP')
      ),
      h('div',{className:'content'},
        page==='dashboard'&&h(Dashboard,{go:setPage}),
        page==='vocab'&&h(VocabPage),
        page==='kanji'&&h(KanjiPage),
        page==='grammar'&&h(GrammarPage),
        page==='flashcard'&&h(FlashcardPage),
        page==='quiz'&&h(QuizPage),
        page==='progress'&&h(ProgressPage)
      )
    )
  )
}

ReactDOM.createRoot(document.getElementById('app')).render(h(App));
</script>
